name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Create a release branch
        run: |
          git checkout -b release
          git push -u origin -f release
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Set the version in package.json
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Create a release commit
        uses: EndBug/add-and-commit@v11
        with:
          add: 'package.json'
          commit: '--signoff'
          message: Release v${{ github.event.inputs.version }}
          push: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the module
        run: pnpm build

      - name: Create tag
        uses: mathieudutour/github-tag-action@v7
        with:
          custom_tag: ${{ github.event.inputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          release_name: v${{ github.event.inputs.version }}
          tag_name: v${{ github.event.inputs.version }}

      - name: Publish to NPM
        run: |
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Prepare package.json for next version
        run: npm version patch --no-git-tag-version

      - name: Push new development commit
        uses: EndBug/add-and-commit@v11
        with:
          add: 'package.json'
          commit: '--signoff'
          message: 'Prepare next development cycle'

      - name: Open a pull request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: Release v${{ github.event.inputs.version }}
          source_branch: release
